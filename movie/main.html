<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간편 영화 후기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./main.css"/>
</head>
<body>
    <nav class="navbar bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">
            <img src="/docs/5.3/assets/brand/bootstrap-logo.svg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
            간편 영화 후기
          </a>
        </div>
      </nav>

    <div class="container">

    </div>
    <div class="row row-cols-1 row-cols-md-3 g-4" id="movie-list">
        <div class="col">
          <div class="card h-100">
            <img src="..." class="card-img-top" alt="...">
            <div class="card-body">
              <h5 class="card-title">Card title</h5>
              <button type="button" class="btn btn-success" id="review-button" onclick="review()">리뷰보기</button>
            </div>
          </div>
        </div>
      </div>

      <div class="modal" id="review-modal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">후기기</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <p>Modal body text goes here.</p>
            </div>
            <div class="modal-footer">
              <input type="text" class="form-control" id="review" style="width: 70%;"/>
              <button type="button" class="btn btn-primary" onclick="add_review()">후기쓰기</button>
            </div>
          </div>
        </div>
      </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script
src="https://code.jquery.com/jquery-3.7.1.min.js"
integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
crossorigin="anonymous"></script>
<script>
    $(document).ready(function(){
        $.ajax({
            url:"https://api.themoviedb.org/3/movie/popular?api_key=10923b261ba94d897ac6b81148314a3f&page=1",data:{"key":"value"},type:"GET",success:function(json){
                console.log(json)
                $("#movie-list").html('')
                let movie_list = json.results;
                for(let i=0; i<movie_list.length; i++){
                    let card = `<div class="col">
                        <div class="card h-100">
                          <img src="${'https://image.tmdb.org/t/p/w500/'+movie_list[i].poster_path}" class="card-img-top" alt="...">
                          <div class="card-body">
                            <h5 class="card-title">${movie_list[i].original_title}</h5>
                            <button type="button" class="btn btn-success" id="review-button" onclick="review(${movie_list[1].id})">리뷰보기</button>
                          </div>
                        </div>
                      </div>`
                    
                    
                      $("#movie-list").append(card)  
                }

            },
            error:function(err){


            }


        })

    })
    const myModalAlternative = new bootstrap.Modal('#review-modal', 'show')
    function review(id)
    {
        $.ajax({
          url:`http://universeapi.net/review/list?movie_id=${id}`,
          data:{},
          type:"GET",
          success:function(json){
            console.log(json.data)
            let reviews = json.data;
            $(".modal-body").html('');
            for(let i=0; i<reviews; i++){
              $(".modal-body").append(`<p>${reviews[i].review}</p>`)
            }
          }

        })
        myModalAlternative.show()

    }

</script>
</body>
</html>
