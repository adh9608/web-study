<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FLOW · 운영 관리</title><link rel="stylesheet" href="app.css"></head>
<body>
<aside class="sidebar"><a class="brand" href="./"><span class="brand-mark">F</span> FLOW<span class="brand-dot">●</span></a><div class="workspace"><span class="workspace-icon">▧</span><div>운영 워크스페이스<small>제품부터 서비스까지</small></div></div><div class="nav-label">WORKSPACE</div><nav id="navigation" aria-label="주 메뉴"></nav><div class="sidebar-footer"><span class="live-dot"></span> 브라우저 저장 모드<small>이 브라우저에 데이터가 저장됩니다.</small></div></aside>
<div class="shell"><header class="topbar"><div>워크스페이스 <span>/</span> <strong id="breadcrumb">제품관리</strong></div><div class="top-right"><span id="today"></span><span class="avatar">관리</span></div></header><main><div class="heading"><div><div class="eyebrow">OPERATIONS MANAGEMENT</div><h1 id="page-title"></h1><p id="page-description"></p></div><button class="primary" id="add-button"></button></div><section id="stats" class="stats" aria-label="현황"></section><section class="list-panel"><div class="list-heading"><div><h2 id="list-title"></h2><span id="record-count"></span></div><div class="tools"><button id="export-button" class="secondary">↓ CSV 내보내기</button></div></div><div class="filters"><div class="filter-tabs" id="filter-tabs"></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="검색" aria-label="목록 검색"></label></div><div class="table-scroll"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div><div id="empty-state" class="empty" hidden></div><div class="table-footer"><span id="result-count"></span><span>등록 정보를 선택해 수정할 수 있습니다.</span></div></section><p class="storage-note">ⓘ 데이터는 현재 브라우저에만 저장됩니다. 중요한 정보는 CSV로 백업해 주세요.</p></main><footer>FLOW <span>작업의 흐름을 한곳에서.</span></footer></div>
